name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}".Trim()
          } else {
            $tag = "${{ github.ref_name }}".Trim()
          }

          if (-not ($tag -match '^v.+')) {
            throw "Release tag must start with v. Current value: $tag"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        shell: pwsh
        run: |
          python -m py_compile main.py gui.py image_processor.py compressor.py logo_manager.py file_utils.py memo_store.py config.py

      - name: Run tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Build executable
        shell: cmd
        run: build.bat

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist\图片处理工具.exe"
          if (-not (Test-Path $exe)) {
            throw "Executable not found: $exe"
          }

          $item = Get-Item $exe
          if ($item.Length -le 0) {
            throw "Executable is empty: $exe"
          }

          Write-Host "Executable size: $([math]::Round($item.Length / 1MB, 2)) MB"

          $archiveListing = (& pyi-archive_viewer --recursive --brief $exe 2>&1) | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect executable archive."
          }

          $requiredEntries = @(
            "assets\fonts\SourceHanSansCN-Medium.otf",
            "assets\fonts\LICENSE.txt",
            "assets\fonts\SOURCE.md"
          )
          foreach ($entry in $requiredEntries) {
            if (-not $archiveListing.Contains($entry)) {
              throw "Required bundled resource is missing from executable: $entry"
            }
          }

          $forbiddenPattern = '(?im)^\s*(?:blind_watermark_service|blind[_-]watermark|cv2|numpy|pywt|pywavelets|opencv[_-]python)(?:[\\/.\s-]|$)'
          $forbiddenMatch = [regex]::Match($archiveListing, $forbiddenPattern)
          if ($forbiddenMatch.Success) {
            throw "Removed dependency is still bundled in executable: $($forbiddenMatch.Value.Trim())"
          }

          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "Executable exited during startup smoke test with code $($process.ExitCode)."
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Create release package
        shell: pwsh
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          $packageDir = "release-package"
          $zipPath = "图片处理工具-$tag-windows.zip"

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          New-Item -ItemType Directory -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Path "$packageDir\THIRD_PARTY_LICENSES" | Out-Null
          Copy-Item "dist\图片处理工具.exe" "$packageDir\图片处理工具.exe"
          Copy-Item "README.md" "$packageDir\README.md"
          Copy-Item "assets\fonts\LICENSE.txt" "$packageDir\THIRD_PARTY_LICENSES\SourceHanSans-LICENSE.txt"
          Copy-Item "assets\fonts\SOURCE.md" "$packageDir\THIRD_PARTY_LICENSES\SourceHanSans-SOURCE.md"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -Force

          if (-not (Test-Path $zipPath)) {
            throw "Release package not found: $zipPath"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 图片处理工具 ${{ steps.release_tag.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            dist/图片处理工具.exe
            图片处理工具-${{ steps.release_tag.outputs.tag }}-windows.zip
